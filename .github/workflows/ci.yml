# CI de CoreNetworking (repositorio del paquete, publicado desde el monorepo spm-pro por
# `git subtree split`). Cuatro comprobaciones: lint estricto, build con warnings como
# errores + tests en macOS + build iOS Simulator, ejemplo `Examples/APIClientApp`, y DocC
# (snippets sincronizados + docbuild sin warnings).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: swift format lint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: swift format lint --strict --recursive Sources Tests Examples Snippets

  test:
    name: build + test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Build estricto (0 warnings)
        run: SWIFT_STRICT_WARNINGS=1 swift build --build-tests
      - name: swift test --parallel
        run: swift test --parallel
      - name: iOS Simulator
        run: xcodebuild build -scheme CoreNetworking-Package -destination 'generic/platform=iOS Simulator' -quiet

  example:
    name: Examples/APIClientApp
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: swift test
        working-directory: Examples/APIClientApp

  docs:
    name: DocC
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Snippets en línea sincronizados
        run: Scripts/check-doc-snippets.sh
      - name: docbuild sin warnings
        run: |
          set -o pipefail
          for dest in 'generic/platform=iOS Simulator' 'platform=macOS'; do
            log=$(xcodebuild docbuild -scheme CoreNetworking-Package -destination "$dest" -derivedDataPath "$(mktemp -d)" 2>&1)
            echo "$log" | grep -E "warning:|error:|\*\* BUILD" | sort -u
            echo "$log" | grep -q "BUILD DOCUMENTATION SUCCEEDED" || exit 1
            ! echo "$log" | grep -qE "warning:|error:"
          done
