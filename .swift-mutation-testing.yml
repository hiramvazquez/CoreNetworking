# swift-mutation-testing configuration
# All settings are optional. CLI flags override file values.

# Limit test execution to a specific target
test-target: CoreNetworkingTests

# Per-mutant test timeout in seconds (default: 30 for SPM)
timeout: 30

# Disable result cache (re-runs all mutants on every execution)
# no-cache: true

# Report output paths
output: mutation-report.json
# html-output: mutation-report.html
# sonar-output: sonar-mutation-report.json

# TRINQUETE, no objetivo: "low" es el score medido la última vez que se corrió esta
# configuración a propósito sobre main (ver CHANGELOG.md e historial de este fichero) — no
# un umbral aspiracional elegido de antemano. El job `mutation` de
# `.github/workflows/ci.yml` falla si el score BAJA de "low"; se sube a mano cuando la
# suite mejora de verdad, nunca al revés. El CLI no lee estos dos números (los escribe con
# 80/60 fijos en el JSON de salida, para SonarQube/Stryker); el trinquete real vive en ese
# paso de CI, que sí los lee de aquí.
thresholds:
  high: 80
  # TRINQUETE, medido — se sube a mano cuando la suite mejora, nunca al reves.
  #
  #   2026-09-04  62,2 %  (79/127)   -> trinquete 55
  #   2026-09-04  76,4 %  (120/157)  -> trinquete 70   [supervivientes 39 -> 19]
  #
  # La segunda medicion es sobre el arbol con la politica de autenticacion, la de
  # redirecciones y el suelo de seguridad ya dentro (~460 lineas de produccion nuevas,
  # que entran restando hasta que se cubren).
  #
  # La holgura de ~6 puntos es deliberada: el score depende de cuantos mutantes agotan el
  # `timeout`, y eso depende de la velocidad de la maquina — un trinquete clavado al valor
  # exacto medido en local haria fallar el CI en un runner mas lento sin que la suite
  # hubiera empeorado en nada.
  low: 70

# Source file glob patterns to exclude from mutation
exclude:
  - "/CoreNetworkingTests/"
  # Ni `Package.swift` ni los `Snippets/` son codigo de produccion: ningun test los
  # ejecuta, asi que sus mutantes SIEMPRE sobreviven y solo diluyen el score (10 mutantes,
  # 0 muertos, 4,5 puntos de score falso).
  - "/Snippets/"
  - "Package.swift"
  # Los mocks son andamio de tests, no codigo de produccion: mutarlos no dice
  # nada sobre si la suite verifica algo, y solo gasta tiempo de build.
  - "/CoreNetworkingTestSupport/"

# Mutation operators — set active: false to disable
mutators:
  - name: RelationalOperatorReplacement
    active: true
  - name: BooleanLiteralReplacement
    active: true
  - name: LogicalOperatorReplacement
    active: true
  - name: ArithmeticOperatorReplacement
    active: true
  - name: NegateConditional
    active: true
  - name: SwapTernary
    active: true
  - name: RemoveSideEffects
    active: true
