# CI de CoreNetworking (repositorio del paquete, publicado desde el monorepo spm-pro por
# `git subtree split`). Cuatro comprobaciones en cada push/PR: lint estricto, build con
# warnings como errores + tests en macOS + build iOS Simulator, ejemplo
# `Examples/APIClientApp`, y DocC (snippets sincronizados + docbuild sin warnings).
#
# - `mutation`: mutation testing con `swift-mutation-testing` (config en
#   `.swift-mutation-testing.yml`) — NO corre en cada push/PR, solo por su propio `schedule`
#   (semanal) o a mano (`workflow_dispatch`): cada mutante recompila y repite la suite, así
#   que la corrida completa tarda minutos por decenas de mutantes, demasiado para el bucle
#   normal de PR. El umbral en `.swift-mutation-testing.yml` es un TRINQUETE fijado al score
#   medido la última vez que se corrió a propósito (no un objetivo aspiracional): el job
#   falla si el score BAJA de ahí, y el umbral se sube a mano cuando la suite mejora de
#   verdad. El informe (JSON + HTML) sube como artefacto del job para poder mirarlo sin
#   volver a correr nada.
# - `red-real`: la suite de red REAL y opt-in de `Tests/CoreNetworkingTests/LiveNetworkTests.swift`
#   (TLS/pinning contra un handshake en vivo, HTTP real contra `dummyjson.com`/`httpbin.org`)
#   — apagada por defecto en `swift test` normal (ver el doc comment del propio fichero) y
#   NUNCA en el camino de push/PR: un backend de terceros que se cae, cambia de
#   comportamiento o limita por rate convertiría el CI de cada PR, determinista y de
#   ~0,1 s, en uno inestable — y la reacción humana a un CI inestable es dejar de mirarlo.
#   Corre sola (~5 s, nada que ver con los ~13 min de `mutation`) por su propio `schedule`
#   DIARIO y por `workflow_dispatch`, para detectar pronto una deriva real (un backend que
#   cambia de comportamiento, una versión de macOS/CFNetwork que deja de disparar un
#   challenge de pinning como se esperaba) sin arriesgar el bucle normal de PR. Un fallo NO
#   bloquea nada — este job nunca corre en push/PR — pero SÍ debe verse: cada test de esta
#   suite anota en su propio mensaje de fallo (`annotatingBackendFailures`, en el propio
#   fichero de test) si la causa pinta a backend caído o a una regresión real de
#   CoreNetworking, así que el log del job basta para decidir sin más triage si hace falta
#   abrir una incidencia o simplemente esperar a que el backend vuelva.
# - Los otros cuatro jobs (`lint`/`test`/`example`/`docs`) llevan
#   `if: github.event_name != 'schedule'` para que NINGÚN disparo por cron repita el CI
#   completo (cada uno de `mutation`/`red-real` distingue SU PROPIO cron con
#   `github.event.schedule`, para no dispararse el uno al otro).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Lunes 06:00 UTC: `mutation`. `workflow_dispatch` de arriba permite lanzarlo a mano.
    - cron: '0 6 * * 1'
    # Diario 07:00 UTC: `red-real` — más barato que `mutation` (segundos, no minutos), así
    # que una cadencia diaria detecta antes una deriva de backend/plataforma sin coste real.
    - cron: '0 7 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: swift format lint
    if: github.event_name != 'schedule'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: swift format lint --strict --recursive Sources Tests Examples Snippets

  test:
    name: build + test
    if: github.event_name != 'schedule'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Build estricto (0 warnings)
        run: SWIFT_STRICT_WARNINGS=1 swift build --build-tests
      - name: swift test --parallel
        run: swift test --parallel
      - name: iOS Simulator
        run: xcodebuild build -scheme CoreNetworking-Package -destination 'generic/platform=iOS Simulator' -quiet

  example:
    name: Examples/APIClientApp
    if: github.event_name != 'schedule'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: swift test
        working-directory: Examples/APIClientApp

  docs:
    name: DocC
    if: github.event_name != 'schedule'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Snippets en línea sincronizados
        run: Scripts/check-doc-snippets.sh
      - name: docbuild sin warnings
        run: |
          set -o pipefail
          for dest in 'generic/platform=iOS Simulator' 'platform=macOS'; do
            log=$(xcodebuild docbuild -scheme CoreNetworking-Package -destination "$dest" -derivedDataPath "$(mktemp -d)" 2>&1) || true
            echo "$log" | grep -E "warning:|error:|\*\* BUILD" | sort -u || true
            echo "$log" | grep -q "BUILD DOCUMENTATION SUCCEEDED" || exit 1
            ! echo "$log" | grep -qE "warning:|error:"
          done

  red-real:
    name: Red real (opt-in — TLS/pinning en vivo, HTTP contra backends públicos)
    # Su PROPIO cron ('0 7 * * *'), no el de `mutation` ('0 6 * * 1'): sin esta distinción,
    # cualquiera de los dos `schedule` de arriba dispararía AMBOS jobs (la condición de
    # `mutation`, antes de este cambio, era solo `event_name == 'schedule'`), duplicando la
    # corrida cara de `mutation` cada lunes. `workflow_dispatch` sigue lanzando los dos —
    # un disparo manual es una petición explícita de "corre todo lo especial".
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 7 * * *'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: swift test (CORENETWORKING_LIVE_NETWORK_TESTS=1) — solo LiveNetworkTests
        run: CORENETWORKING_LIVE_NETWORK_TESTS=1 swift test --filter LiveNetworkTests

  mutation:
    name: Mutation testing (swift-mutation-testing)
    # Su PROPIO cron ('0 6 * * 1'), no el diario de `red-real` — ver el comentario de arriba.
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 6 * * 1'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Instalar swift-mutation-testing
        run: brew install ericodx/tools/swift-mutation-testing

      - name: Cache de mutantes (evita re-testear mutantes sin cambios en Sources/Tests)
        uses: actions/cache@v4
        with:
          path: .swift-mutation-testing-cache
          key: mutation-${{ runner.os }}-${{ hashFiles('Sources/**/*.swift', 'Tests/**/*.swift') }}
          restore-keys: mutation-${{ runner.os }}-

      - name: swift-mutation-testing (config en .swift-mutation-testing.yml)
        run: |
          set -o pipefail
          swift-mutation-testing . --html-output mutation-report.html | tee mutation-run.log

      - name: Comprobar el trinquete (thresholds.low de .swift-mutation-testing.yml)
        run: |
          # "Overall mutation score: NN.N%" lo imprime la propia herramienta con SU fórmula
          # (killed / (killed + survived + timeouts + noCoverage) × 100, unviable excluido) —
          # se lee de ahí en vez de recalcularla para no duplicar esa lógica. El propio CLI
          # no lee `thresholds:` del YAML (solo lo escribe, con 80/60 fijos, en el JSON de
          # salida) — el trinquete de verdad es este paso, comparando contra el número que
          # documenta `.swift-mutation-testing.yml`.
          score=$(grep -oE "Overall mutation score: [0-9.]+" mutation-run.log | grep -oE "[0-9.]+$")
          [ -n "$score" ] || { echo "::error::No se encontró la línea 'Overall mutation score:' en la salida"; exit 1; }
          # awk, no PyYAML (no viene instalado por defecto en el runner): el fichero es
          # sencillo, "thresholds:" seguido de "high:"/"low:" con dos espacios de indentación.
          low=$(awk '/^thresholds:/{f=1; next} f && /low:/{print $2; exit}' .swift-mutation-testing.yml)
          [ -n "$low" ] || { echo "::error::No se encontró thresholds.low en .swift-mutation-testing.yml"; exit 1; }
          echo "Score: $score % · trinquete (thresholds.low): $low %"
          echo "### Mutation testing: $score % (trinquete: $low %)" >> "$GITHUB_STEP_SUMMARY"
          awk -v s="$score" -v l="$low" 'BEGIN { exit !(s+0 >= l+0) }' \
            || { echo "::error::El score de mutation testing ($score%) bajó del trinquete ($low%)"; exit 1; }

      - name: Subir informe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: |
            mutation-report.json
            mutation-report.html
            mutation-run.log
          if-no-files-found: warn
